{% extends "base.html" %}

{% block title %}
Registrar métricas | Plataforma FLC
{% endblock %}

{% block content %}

<section class="page-container">

    <div class="page-header">

        <div>
            <p>Métricas digitales</p>

            <h1>Registrar métricas</h1>

            <p>
                Ingresa los resultados obtenidos por una
                publicación institucional.
            </p>
        </div>

        <a
            href="{% url 'metricas:lista' %}"
            class="btn-secondary"
        >
            Ver métricas
        </a>

    </div>

    <div class="form-card">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn-primary"
            >
                Registrar métricas
            </button>

        </form>

    </div>

</section>

{% endblock %}
